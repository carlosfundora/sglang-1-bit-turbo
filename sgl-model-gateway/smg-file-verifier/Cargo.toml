[package]
name = "smg-file-verifier"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = { version = "0.10", features = ["asm"] }
rayon = "1.10"
anyhow = "1.0"
thiserror = "2.0"
hex = "0.4"
ignore = "0.4"

[lib]
name = "smg_file_verifier"
crate-type = ["rlib", "cdylib"]

[dependencies.pyo3]
version = "0.28.3"
features = ["extension-module"]
optional = true

[features]
python = ["pyo3"]
