name: portable-sanity

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "20 8 * * *"

permissions:
  contents: read

concurrency:
  group: sglang-1-bit-turbo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-sanity:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Try runtime install
        run: |
          pip install -e "python[all]" || true

      - name: Compile Python sources
        shell: bash
        run: |
          python - <<'PY'
          import pathlib, py_compile, sys
          failed = []
          for path in pathlib.Path('.').rglob('*.py'):
              try:
                  py_compile.compile(str(path), doraise=True)
              except Exception as e:
                  failed.append((str(path), str(e)))
          if failed:
              for p, e in failed:
                  print(f"{p}: {e}")
              sys.exit(1)
          print('python compile sanity passed')
          PY

      - name: Best-effort import smoke
        run: python -c "import sglang; print('ok')" || true

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sglang-1-bit-turbo-failure
          path: |
            **/*.log
            .pytest_cache
          if-no-files-found: ignore
