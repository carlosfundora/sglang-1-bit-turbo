name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'python/**'
      - 'sglang/**'
      - 'sgl-kernel/**'
      - 'scripts/**'
      - 'tests/**'
      - 'docs/**'
      - 'README*'
      - '.pre-commit-config.yaml'
      - '.github/linters/**'
      - '.github/workflows/lint.yml'
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pre-commit hook
        run: |
          python -m pip install pre-commit
          pre-commit install

      - name: Run pre-commit checks on changed files
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD" | grep -E '^(python/|sglang/|sgl-kernel/|scripts/|tests/|docs/|README|\.github/linters/|\.pre-commit-config\.yaml|\.github/workflows/lint\.yml)' || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No lint-relevant files changed."
            exit 0
          fi
          printf 'Linting changed files:\n'
          printf '%s\n' "${files[@]}"
          SKIP=no-commit-to-branch pre-commit run --show-diff-on-failure --files "${files[@]}"

      - name: Run pre-commit checks on push/manual
        if: github.event_name != 'pull_request'
        run: SKIP=no-commit-to-branch pre-commit run --all-files --show-diff-on-failure

      - name: Run lychee docs checks (offline references)
        if: contains(github.event.pull_request.title || '', 'docs') || github.event_name != 'pull_request'
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2
        with:
          args: --config .github/linters/lychee.toml README.md "docs/**/*.md" "docs/**/*.rst" "docs/**/*.ipynb"

      - name: Run sgl-kernel clang-format checks
        if: github.event_name != 'pull_request'
        uses: DoozyX/clang-format-lint-action@v0.20
        with:
          source: sgl-kernel
          extensions: h,c,cpp,hpp,cu,cuh,cc
          clangFormatVersion: 20
          style: file
